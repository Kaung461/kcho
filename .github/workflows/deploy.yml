name: Deploy web build to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Build web release
        # --pwa-strategy=none: skip the service worker entirely. Flutter's
        # default service worker caches the whole app for offline use, but
        # needs TWO reloads to pick up a new deploy (install, then
        # activate) — in practice this meant visitors kept seeing stale,
        # sometimes broken, builds. Plain HTTP requests trade away offline
        # support for always serving the latest deploy, which matters more
        # for a frequently-updated demo site than for an offline-capable PWA.
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          flutter build web --release --base-href /kcho/ --pwa-strategy=none \
            --dart-define=GROQ_API_KEY="$GROQ_API_KEY"

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build/web
